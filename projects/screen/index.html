<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10191f"><meta name="description" content="于屿的影视、游戏与动画项目照片及声音工作记录。"><title>影视与互动内容 — 于屿声音作品集</title><style>
:root{color-scheme:dark;--paper:#10191f;--ink:#ece9e1;--muted:#a1adb0;--green:#73c2bc;--coral:#ed906d;--line:rgba(222,235,230,.17);--serif:"Iowan Old Style","Songti SC","STSong","Noto Serif CJK SC",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 83% 8%,rgba(34,92,93,.2),transparent 33%),var(--paper);color:var(--ink);font-family:var(--sans)}.wrap{width:min(100% - 48px,1120px);margin:auto}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:inherit}.brand{font-size:13px;font-weight:650;letter-spacing:.08em;text-decoration:none}.back{font-size:12px;color:var(--muted);text-decoration:none}.back:hover{color:var(--green)}main{padding:70px 0 90px}.eyebrow{margin:0 0 20px;color:var(--green);font-size:11px;letter-spacing:.18em}.top{display:grid;grid-template-columns:1fr .78fr;gap:48px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:46px}.top h1{margin:0;font:500 clamp(42px,6vw,68px)/1.15 var(--serif)}.top p:last-child{max-width:580px;color:#c0cbca;font:18px/1.9 var(--serif);margin:20px 0 0}.count{color:var(--muted);font-size:12px;letter-spacing:.08em}.section-title{display:flex;justify-content:space-between;align-items:end;margin:38px 0 20px}.section-title h2{font:500 30px/1.2 var(--serif);margin:0}.section-title span{color:var(--muted);font-size:12px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.shot{margin:0;overflow:hidden;border:1px solid var(--line);background:#17252c}.shot button{border:0;padding:0;display:block;width:100%;background:none;cursor:zoom-in}.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .3s}.shot button:hover img{transform:scale(1.035)}.shot figcaption{padding:10px 13px;color:#bac4c1;font-size:11px;letter-spacing:.04em}.highlights{margin:38px 0 0;padding:22px 24px;border:1px solid var(--line);background:#17252c}.highlights h2{margin:0 0 12px;color:var(--green);font:500 22px/1.3 var(--serif)}.highlights p{margin:6px 0;color:#c0cbca;font-size:13px;line-height:1.9}.highlights strong{color:#ece9e1;font-weight:600}.note{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}footer{padding:20px 0 30px;color:var(--muted);font-size:11px}dialog{border:1px solid var(--line);padding:0;background:#0b1014;color:var(--ink);max-width:min(94vw,1200px);max-height:92vh}dialog::backdrop{background:rgba(2,5,8,.88)}dialog img{display:block;max-width:90vw;max-height:82vh;object-fit:contain}dialog .controls{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;color:var(--muted)}dialog button{background:none;color:var(--ink);border:1px solid var(--line);padding:7px 12px;cursor:pointer}@media(max-width:760px){.wrap{width:min(100% - 34px,1120px)}.top{grid-template-columns:1fr;gap:20px;padding-bottom:32px}main{padding-top:48px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.shot figcaption{padding:8px;font-size:10px}}@media(max-width:430px){.gallery{grid-template-columns:1fr 1fr}.shot img{aspect-ratio:1/1}}
</style></head><body><div class="wrap"><header><a class="brand" href="../../">于屿 / SOUND</a><a class="back" href="../../#projects">← 返回项目经历</a></header><main><section class="top"><div><p class="eyebrow">SCREEN & FILM</p><h1>影视与互动内容</h1><p>纪录片、影视节目以及游戏动画方向的声音工作；下方照片展示影视制作现场。</p></div><div class="count">PROJECT PHOTOS&nbsp;&nbsp; / &nbsp;&nbsp;06 IMAGES</div></section><div class="section-title"><h2>现场记录</h2><span>点击照片可放大浏览</span></div><section class="gallery" aria-label="影视现场项目照片"><figure class="shot"><button type="button" data-index="0" aria-label="放大查看第 1 张照片"><img src="../../assets/photos/screen-01.jpg" alt="影像录音与声音后期" loading="lazy"></button><figcaption>影像录音与声音后期</figcaption></figure><figure class="shot"><button type="button" data-index="1" aria-label="放大查看第 2 张照片"><img src="../../assets/photos/screen-02.jpg" alt="影像录音与声音后期" loading="lazy"></button><figcaption>影像录音与声音后期</figcaption></figure><figure class="shot"><button type="button" data-index="2" aria-label="放大查看第 3 张照片"><img src="../../assets/photos/screen-03.jpg" alt="影像录音与声音后期" loading="lazy"></button><figcaption>影像录音与声音后期</figcaption></figure><figure class="shot"><button type="button" data-index="3" aria-label="放大查看第 4 张照片"><img src="../../assets/photos/screen-04.jpg" alt="影像录音与声音后期" loading="lazy"></button><figcaption>影像录音与声音后期</figcaption></figure><figure class="shot"><button type="button" data-index="4" aria-label="放大查看第 5 张照片"><img src="../../assets/photos/screen-05.jpg" alt="影像录音与声音后期" loading="lazy"></button><figcaption>影像录音与声音后期</figcaption></figure><figure class="shot"><button type="button" data-index="5" aria-label="放大查看第 6 张照片"><img src="../../assets/photos/screen-06.jpg" alt="影像录音与声音后期" loading="lazy"></button><figcaption>影像录音与声音后期</figcaption></figure></section><section class="highlights"><h2>相关作品</h2><p><strong>影视：</strong>《无尽攀登》（金鸡奖最佳纪录片提名）、《中国考古》第一、二季等。</p><p><strong>游戏与动画：</strong>《崩坏 3》《原神》《阴阳师》《哈利波特》等。</p></section><p class="note">照片按项目类型整理。部分现场影像包含演出、设备与制作过程。</p></main><footer>© 于屿 · 声音作品集</footer></div><dialog id="viewer"><img id="large" alt=""><div class="controls"><button id="prev" type="button">← 上一张</button><span id="counter"></span><button id="close" type="button">关闭</button><button id="next" type="button">下一张 →</button></div></dialog><script>const photos=["../../assets/photos/screen-01.jpg","../../assets/photos/screen-02.jpg","../../assets/photos/screen-03.jpg","../../assets/photos/screen-04.jpg","../../assets/photos/screen-05.jpg","../../assets/photos/screen-06.jpg"];const dialog=document.getElementById('viewer'),large=document.getElementById('large'),counter=document.getElementById('counter');let current=0;function show(i){current=(i+photos.length)%photos.length;large.src=photos[current];counter.textContent=(current+1)+' / '+photos.length;}document.querySelectorAll('.shot button').forEach(b=>b.addEventListener('click',()=>{show(Number(b.dataset.index));dialog.showModal();}));document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1);});</script></body></html>
