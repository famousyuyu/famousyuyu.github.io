<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <meta name="description" content="yuyu 的个人主页。">
  <title>yuyu — 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f2ec;
      --ink: #1f2824;
      --muted: #65716a;
      --green: #426653;
      --line: rgba(31, 40, 36, .15);
      --serif: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
    }
    .page {
      width: min(100% - 48px, 1080px);
      margin: 0 auto;
    }
    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      letter-spacing: .08em;
    }
    .mark { font-weight: 650; }
    .status { color: var(--muted); display: flex; align-items: center; gap: 9px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #719477; }
    main { padding: clamp(72px, 13vw, 150px) 0 106px; }
    .eyebrow {
      color: var(--green);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: .16em;
      margin: 0 0 26px;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(64px, 12vw, 132px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 500;
      margin: 0;
    }
    .intro {
      max-width: 570px;
      margin: 34px 0 0;
      color: #48564e;
      font-family: var(--serif);
      font-size: clamp(20px, 3vw, 27px);
      line-height: 1.65;
    }
    .rule { height: 1px; background: var(--line); margin: 76px 0 28px; }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    .label { color: var(--muted); font-size: 12px; letter-spacing: .12em; margin: 0 0 14px; }
    .copy { margin: 0; max-width: 420px; font-size: 15px; line-height: 1.9; }
    footer {
      min-height: 78px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
    @media (max-width: 600px) {
      .page { width: min(100% - 36px, 1080px); }
      header { height: 64px; }
      main { padding-top: 84px; padding-bottom: 76px; }
      .details { grid-template-columns: 1fr; gap: 30px; }
      .rule { margin-top: 54px; }
      footer { gap: 16px; align-items: flex-start; flex-direction: column; justify-content: center; padding: 18px 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="mark">个人主页</span>
      <span class="status"><span class="dot" aria-hidden="true"></span>你好，欢迎来访</span>
    </header>
    <main>
      <p class="eyebrow">Hello, I'm</p>
      <h1>yuyu<span aria-hidden="true">.</span></h1>
      <p class="intro">你好，欢迎来到我的小小角落。<br>这里会慢慢记录我正在关注、学习和创造的事。</p>
      <div class="rule"></div>
      <section class="details" aria-label="关于我">
        <div>
          <p class="label">关于</p>
          <p class="copy">我叫 yuyu，正在探索数字世界里的新可能。这个页面是我的个人主页，也会随着新的想法和作品不断更新。</p>
        </div>
        <div>
          <p class="label">最近</p>
          <p class="copy">刚开始认识 GitHub，准备在这里分享我的学习过程与小项目。敬请期待。</p>
        </div>
      </section>
    </main>
    <footer>
      <span>© <span id="year">2026</span> yuyu</span>
      <span>用一点好奇心，慢慢搭建。</span>
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
